name: Run Auto Sign

on:
  workflow_dispatch:
  schedule:
    # UTC time (Beijing time 08:00)
    - cron: "0 0 * * *"

env:
  SM_USERNAME: ${{ secrets.SM_USERNAME }}
  SM_PASSWORD: ${{ secrets.SM_PASSWORD }}

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run sign-in
        run: node main.js
